name: ScopeProof base advance

on:
  push:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  invalidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Revoke stale ScopeProof checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install ScopeProof
        run: pip install "scopeproof @ git+https://github.com/YuzeJ21/Scope-Proof.git@50058cffd28fb3d4b9bf6da97d05f77ab4dcb509"
      - name: Revoke stale exact-head displays
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          scopeproof-github-action \
            --invalidate-base-advance \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --after-sha "$GITHUB_SHA"
      - name: Boundary
        run: |
          echo "Only existing exact-head informational Checks can be updated."
          echo "No pull-request head or target-repository code is checked out or executed."
