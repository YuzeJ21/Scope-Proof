name: ScopeProof

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  checks: write

env:
  # Keep this informational until the repository owner intentionally promotes it.
  SCOPEPROOF_REQUIRED_CHECK: false

concurrency:
  group: scopeproof-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'scopeproof-review')
    name: ScopeProof evidence review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install locked ScopeProof environment
        run: |
          python -m pip install uv==0.11.29
          python -m uv sync --frozen
      - name: Review public PR evidence (informational)
        continue-on-error: true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "SCOPEPROOF_VERDICT=needs_review" >> "$GITHUB_ENV"
          echo "SCOPEPROOF_REQUIREMENTS_CONFIRMED=false" >> "$GITHUB_ENV"
          if [ -f .scopeproof/requirements.txt ] && [ -f .scopeproof/requirements-confirmation.json ]; then
            python -m uv run --frozen scopeproof validate-requirements-confirmation \
              --requirements .scopeproof/requirements.txt \
              --confirmation .scopeproof/requirements-confirmation.json
            echo "SCOPEPROOF_REQUIREMENTS_CONFIRMED=true" >> "$GITHUB_ENV"
            python -m uv run --frozen scopeproof review --pr "$PR_URL" \
              --requirements .scopeproof/requirements.txt \
              --confirmation .scopeproof/requirements-confirmation.json \
              --storage-dir .scopeproof/reviews > "$RUNNER_TEMP/scopeproof-result.json"
            python -m uv run --frozen python -c 'import json; print("SCOPEPROOF_VERDICT=" + json.load(open("'"$RUNNER_TEMP"'/scopeproof-result.json"))["verdict"])' >> "$GITHUB_ENV"
            review_id=$(python -m uv run --frozen python -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/scopeproof-result.json"))["review_id"])')
            if python -m uv run --frozen scopeproof export "$review_id" --storage-dir .scopeproof/reviews --format markdown > "$RUNNER_TEMP/scopeproof-report.tmp.md" &&
              [ -s "$RUNNER_TEMP/scopeproof-report.tmp.md" ] &&
              mv "$RUNNER_TEMP/scopeproof-report.tmp.md" "$RUNNER_TEMP/scopeproof-report.md"; then
              :
            else
              echo "SCOPEPROOF_VERDICT=needs_review" >> "$GITHUB_ENV"
              exit 1
            fi
          fi
      - name: Upload ScopeProof report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scopeproof-report
          path: ${{ runner.temp }}/scopeproof-report.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Emit fork-safe ScopeProof summary plan
        run: |
          content_args=()
          if [ -s "$RUNNER_TEMP/scopeproof-report.md" ]; then
            content_args+=(--content-file "$RUNNER_TEMP/scopeproof-report.md")
          fi
          if [ "$SCOPEPROOF_REQUIREMENTS_CONFIRMED" = "true" ]; then
            python -m uv run --frozen python -m scopeproof_core.github_action_runner \
              --event-path "$GITHUB_EVENT_PATH" \
              --requirements-confirmed \
              --verdict "$SCOPEPROOF_VERDICT" "${content_args[@]}"
          else
            python -m uv run --frozen python -m scopeproof_core.github_action_runner \
              --event-path "$GITHUB_EVENT_PATH" \
              --content "Checked-in .scopeproof/requirements.txt is missing."
          fi
      - name: Publish exact-head informational Check
        if: github.event.pull_request.head.repo.fork == false && hashFiles('.scopeproof/requirements.txt') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$SCOPEPROOF_REQUIREMENTS_CONFIRMED" != "true" ]; then
            echo "ScopeProof: requirements confirmation is unavailable or does not match."
            exit 0
          fi
          content_args=(--content "No validated ScopeProof report was produced; evidence remains unavailable.")
          if [ -s "$RUNNER_TEMP/scopeproof-report.md" ]; then
            content_args=(--content-file "$RUNNER_TEMP/scopeproof-report.md")
          fi
          python -m uv run --frozen python -m scopeproof_core.github_action_runner \
            --event-path "$GITHUB_EVENT_PATH" \
            --requirements .scopeproof/requirements.txt \
            --confirmation .scopeproof/requirements-confirmation.json \
            --verdict "$SCOPEPROOF_VERDICT" \
            --publish-check "${content_args[@]}"
      - name: Publication boundary
        run: |
          echo "Fork pull requests never receive a write request."
          echo "The Check is neutral and informational; required-check mode remains disabled."

  withdraw:
    if: github.event.action == 'unlabeled' && github.event.label.name == 'scopeproof-review'
    name: Withdraw ScopeProof applicability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install locked ScopeProof environment
        run: |
          python -m pip install uv==0.11.29
          python -m uv sync --frozen
      - name: Withdraw exact-head informational Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m uv run --frozen python -m scopeproof_core.github_action_runner \
            --event-path "$GITHUB_EVENT_PATH" \
            --withdraw-check \
            --content "The scopeproof-review label was removed; applicability is withdrawn."
