name: ScopeProof base advance

on:
  push:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  invalidate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Revoke stale ScopeProof checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install locked ScopeProof environment
        run: |
          python -m pip install uv==0.11.29
          python -m uv sync --frozen
      - name: Revoke stale exact-head displays
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          python -m uv run --frozen scopeproof-github-action \
            --invalidate-base-advance \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --after-sha "$GITHUB_SHA"
      - name: Boundary
        run: |
          echo "Only existing exact-head informational Checks can be updated."
          echo "No pull-request head or target-repository code is checked out or executed."
