name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility-python-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[dev,research]'
      - name: Test
        run: python -m pytest -q
      - name: Deterministic benchmark
        run: python -m scopeproof_core.evals.runner
      - name: Installed wheel compatibility smoke
        run: |
          wheel_dir="$RUNNER_TEMP/scopeproof-wheel-python-311"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'scopeproof-*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          (cd "$RUNNER_TEMP" && python -c 'from importlib.metadata import version; from scopeproof_core import __version__; assert version("scopeproof") == __version__')
          (cd "$RUNNER_TEMP" && scopeproof --version)
          (cd "$RUNNER_TEMP" && scopeproof-web --version)
          (cd "$RUNNER_TEMP" && python -m scopeproof_core.evals.r002_swebench --help)

  compatibility-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[dev,research]'
      - name: Test
        run: python -m pytest -q
      - name: Deterministic benchmarks
        run: |
          python -m scopeproof_core.evals.runner
          scopeproof comparison-benchmark
      - name: Installed wheel compatibility smoke
        run: |
          wheel_dir="$RUNNER_TEMP/scopeproof-wheel-python-313"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'scopeproof-*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          python -m pip check
          (cd "$RUNNER_TEMP" && python -c 'from importlib.metadata import version; from scopeproof_core import __version__; assert version("scopeproof") == __version__')
          (cd "$RUNNER_TEMP" && scopeproof --version)
          (cd "$RUNNER_TEMP" && scopeproof-web --version)
          (cd "$RUNNER_TEMP" && scopeproof benchmark)
          (cd "$RUNNER_TEMP" && scopeproof comparison-benchmark)

          web_log="$RUNNER_TEMP/scopeproof-web-python-313.log"
          web_pid=""
          cleanup() {
            if [ -n "$web_pid" ]; then
              kill -- -"$web_pid" 2>/dev/null || true
              wait "$web_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          setsid scopeproof-web --host 127.0.0.1 --port 8513 > "$web_log" 2>&1 &
          web_pid=$!

          healthy=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$web_pid" 2>/dev/null; then
              echo "Installed Python 3.13 workbench exited before becoming healthy."
              cat "$web_log"
              exit 1
            fi
            if response="$(curl --fail --silent http://127.0.0.1:8513/_stcore/health 2>/dev/null)"; then
              if [ "$response" = "ok" ]; then
                healthy=1
                break
              fi
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Installed Python 3.13 workbench did not become healthy within 30 seconds."
            cat "$web_log"
            exit 1
          fi

  compatibility-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[dev,research]'
      - name: Import package, CLI, and storage backends
        run: python -c "import scopeproof_core; import scopeproof_core.cli; import scopeproof_core.alpha.storage; import scopeproof_core.alpha.rehearsal_storage"
      - name: Platform-safe storage and CLI regressions
        run: python -m pytest -q tests/storage/test_atomic_files.py tests/alpha/test_storage.py::test_alpha_case_round_trips_as_validated_json tests/alpha/test_storage.py::test_alpha_case_save_refuses_silent_overwrite tests/alpha/test_storage.py::test_cli_and_alpha_storage_import_without_posix_only_constants tests/alpha/test_storage.py::test_concurrent_process_alpha_creates_publish_exactly_once tests/alpha/test_storage.py::test_concurrent_process_outcome_updates_commit_exactly_once tests/alpha/test_storage.py::test_alpha_case_update_rejects_completed_outcome_overwrite tests/alpha/test_storage.py::test_alpha_store_rejects_symlinked_existing_ancestor tests/alpha/test_storage.py::test_alpha_store_revalidates_loaded_payload tests/alpha/test_storage.py::test_alpha_store_rejects_valid_record_under_different_id tests/alpha/test_rehearsal_storage.py::test_default_rehearsal_directory_is_separate_from_genuine_cases tests/alpha/test_rehearsal_storage.py::test_rehearsal_round_trips_as_validated_json tests/alpha/test_rehearsal_storage.py::test_rehearsal_listing_is_deterministically_sorted tests/alpha/test_rehearsal_storage.py::test_rehearsal_save_refuses_silent_overwrite tests/alpha/test_rehearsal_storage.py::test_rehearsal_store_revalidates_loaded_payload tests/alpha/test_rehearsal_storage.py::test_concurrent_rehearsal_saves_create_exactly_once tests/alpha/test_rehearsal_storage.py::test_rehearsal_store_rejects_valid_record_under_different_id tests/cli/test_cli.py::test_review_can_write_markdown_report_in_one_command tests/cli/test_cli.py::test_review_refuses_to_overwrite_report_before_reading_inputs tests/cli/test_cli.py::test_review_report_final_publication_does_not_overwrite_racing_target
      - name: Build and install wheel
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP "scopeproof-wheel-windows"
          python -m pip wheel . --no-deps --wheel-dir $wheelDir
          $wheel = (Get-ChildItem $wheelDir -Filter "scopeproof-*.whl" | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          python -m pip check
          Push-Location $env:RUNNER_TEMP
          python -c "from importlib.metadata import version; from scopeproof_core import __version__; assert version('scopeproof') == __version__"
          scopeproof --version
          scopeproof-web --version
          scopeproof benchmark
          scopeproof comparison-benchmark
          Pop-Location

  locked-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked environment tool
        run: python -m pip install uv==0.11.29
      - name: Sync locked environment
        run: python -m uv sync --extra dev --extra research --locked
      - name: Repository contracts
        run: python -m uv run python -m pytest -q tests/test_repository_contracts.py
      - name: Deterministic benchmark
        run: python -m uv run scopeproof benchmark
      - name: Deterministic comparison benchmark
        run: python -m uv run scopeproof comparison-benchmark

  verify:
    needs: [compatibility-python-311, compatibility-python-313, compatibility-windows, locked-environment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install
        run: python -m pip install -e '.[dev,research]'
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: >-
          python -m pytest
          --cov=scopeproof_core
          --cov=apps
          --cov-report=term-missing:skip-covered
          --cov-fail-under=95
          -q
      - name: Deterministic benchmark
        run: python -m scopeproof_core.evals.runner
      - name: Installed wheel smoke
        run: |
          wheel_dir="$RUNNER_TEMP/scopeproof-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          wheel="$(find "$wheel_dir" -type f -name 'scopeproof-*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          (cd "$RUNNER_TEMP" && python -c 'from importlib.metadata import version; from scopeproof_core import __version__; from scopeproof_core.schemas.models import Review; review = Review(repository="acme/repo", pr_number=1, base_sha="base", head_sha="head"); assert version("scopeproof") == __version__ == review.tool_version')
          (cd "$RUNNER_TEMP" && scopeproof --version)
          (cd "$RUNNER_TEMP" && scopeproof-web --version)
          (cd "$RUNNER_TEMP" && scopeproof benchmark)
          (cd "$RUNNER_TEMP" && scopeproof comparison-benchmark)
          (cd "$RUNNER_TEMP" && python -m scopeproof_core.evals.r002_swebench --help)

          web_log="$RUNNER_TEMP/scopeproof-web.log"
          web_pid=""
          cleanup() {
            if [ -n "$web_pid" ]; then
              kill -- -"$web_pid" 2>/dev/null || true
              wait "$web_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          setsid scopeproof-web --host 127.0.0.1 --port 8512 > "$web_log" 2>&1 &
          web_pid=$!

          healthy=0
          for attempt in $(seq 1 30); do
            if ! kill -0 "$web_pid" 2>/dev/null; then
              echo "Installed ScopeProof workbench exited before becoming healthy."
              cat "$web_log"
              exit 1
            fi
            if response="$(curl --fail --silent http://127.0.0.1:8512/_stcore/health 2>/dev/null)"; then
              if [ "$response" = "ok" ]; then
                healthy=1
                break
              fi
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Installed ScopeProof workbench did not become healthy within 30 seconds."
            cat "$web_log"
            exit 1
          fi
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Packaged browser regression
        run: python -m pytest -q -m browser tests/browser
